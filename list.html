<!doctype html>
<style>
ul {list-style: none; padding-left: 12px;}
li {margin-bottom: 6px;}
p {padding-left: 12px;}
</style>
<ul id = "files"></ul>
<p id = "count"></p>
<script>
const owner = "Dragenku", repo = "dragenku.github.io", branch = "main";
const page = "https://dragenku.github.io/";
const path = new URLSearchParams(location.search).get("path")||"";
fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`)
.then(r => r.json()).then(items =>{
  files.innerHTML = items.map(x => `<li>${x.type === "dir"
    ? `<a href = "?path=${encodeURIComponent(x.path)}">${x.name}.folder</a>`
    : `<a href = "${page+x.path}">${x.name}</a>`}</li>`).join("");
  count.textContent = `${items.length} items`;
});
</script>
